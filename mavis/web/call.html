<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Call Johnny</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<link rel="manifest" href="/johnny/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/johnny/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/johnny/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Johnny">
<style>
:root{
  --bg:#07080c; --text:#e8e8f0; --muted:#8a8aa0; --accent:#ff2a6d; --cyan:#05d9e8;
  --call:#22c55e; --end:#dc2626; --card:rgba(10,10,18,.62);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .6s}
body.idle #stage{filter:brightness(.45)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);z-index:1}
.hidden{display:none!important}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px 24px;width:min(340px,100%);text-align:center}
/* Brush-calligraphy title (Ma Shan Zheng, SIL OFL; web/fonts/OFL.txt).
   Self-hosted subset of just J-o-h-n-y, so the CSP needs no font host. */
@font-face{font-family:'Johnny Title';src:url(/johnny/fonts/johnny-title.woff2) format('woff2');font-display:swap}
/* Only the letters J-o-h-n-y exist in this font: use it for the name alone. */
.card h1.title{margin:0 0 4px;font:400 44px/1.1 'Johnny Title',serif;letter-spacing:.04em;color:#caa25f;
  text-shadow:0 0 18px rgba(202,162,95,.25)}
.card p{margin:0 0 22px;color:var(--muted)}
.card input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2a2a3a;background:#0e0e18;color:var(--text);font-size:16px}
.round{width:76px;height:76px;border-radius:50%;border:0;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .1s,background .2s}
.round:active{transform:scale(.94)}
.round.call{background:var(--call);color:#052e14;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2.4s infinite}
.round.end{background:var(--end)}
.round.mute{background:rgba(255,255,255,.14)}
.round.mute.on{background:#fff;color:#111}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 18px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.btn{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
.link{display:block;margin:16px auto 0;color:var(--muted);font-size:13px;background:none;border:0;text-decoration:underline;cursor:pointer}
.err{color:#ff8a8a;min-height:1.2em;margin-top:10px;font-size:14px}
footer{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:11px;padding:0 16px;z-index:1}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
#timer{font-variant-numeric:tabular-nums;font-size:17px}
#stateLabel{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:lowercase}
#bottom{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:18px;z-index:2;padding:0 16px}
#caption{max-width:560px;text-align:center;font-size:17px;line-height:1.35;min-height:2.7em;text-shadow:0 1px 8px #000;opacity:0;transition:opacity .4s}
#caption.show{opacity:1}
.row{display:flex;gap:40px}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;pointer-events:none}
.toast{background:rgba(0,0,0,.82);border:1px solid #333;padding:9px 14px;border-radius:10px;font-size:14px;max-width:100%;animation:fade 4s forwards}
@keyframes fade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
#orb{position:fixed;left:50%;top:42%;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,var(--accent),var(--cyan));z-index:0}
#fps{position:fixed;top:4px;left:6px;font:12px monospace;color:#9f9;z-index:9}
#loading{color:var(--muted);font-size:14px;margin-top:10px}
#screen-idle{justify-content:flex-end;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
</style>
<script type="importmap">
{"imports":{
  "three":"/johnny/vendor/three/build/three.module.js",
  "three/addons/":"/johnny/vendor/three/examples/jsm/"
}}
</script>
</head>
<body class="idle">
<canvas id="stage"></canvas>
<div id="orb" class="hidden"></div>

<div id="screen-key" class="screen hidden">
  <div class="card">
    <h1 class="title">Johnny</h1>
    <p>Enter your MAVIS key once. It stays on this device.</p>
    <input id="keyInput" type="password" autocomplete="current-password" placeholder="Key" aria-label="Key">
    <button id="saveKey" class="btn">Save</button>
    <div id="keyError" class="err"></div>
  </div>
</div>

<div id="screen-idle" class="screen hidden">
  <div class="card">
    <h1 class="title">Johnny</h1>
    <p>Your fixer. Mostly sober.</p>
    <button id="callBtn" class="round call" aria-label="Call Johnny">Call</button>
    <div id="loading">loading Johnny…</div>
    <button id="changeKey" class="link">change key</button>
  </div>
</div>

<div id="screen-call" class="hidden">
  <div id="top"><div id="timer">00:00</div><div id="stateLabel">connecting…</div></div>
  <div id="bottom">
    <div id="caption" aria-live="polite"></div>
    <div class="row">
      <button id="muteBtn" class="round mute" aria-label="Mute microphone" aria-pressed="false">Mute</button>
      <button id="endBtn" class="round end" aria-label="End call">End</button>
    </div>
  </div>
</div>

<footer id="credit">Model: Johnny Silverhand port by KonnieGFX · character © CD Projekt Red</footer>
<div id="toasts"></div>
<div id="fps" class="hidden"></div>

<script type="module" src="/johnny/call.js"></script>
</body>
</html>
