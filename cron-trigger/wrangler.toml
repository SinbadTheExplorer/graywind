name = "graywind-cron-trigger"
main = "src/index.js"
compatibility_date = "2026-09-03"

# Cloudflare Cron Triggers are core scheduled-compute infra, not a bolted-on
# git feature the way GitHub Actions' `schedule:` event is -- this is the
# actual fix for the cadence collapse documented in live-trading.yml's
# top-of-file comment. Full 15-min cadence restored here since the
# reliability problem was GitHub's own scheduler, not this Worker's.
[triggers]
# Day names, never numbers: Cloudflare counts 1 = Sunday ... 7 = Saturday
# (GitHub/Unix cron: 0 = Sunday), so the old "1-5" meant Sun-Thu -- this
# Worker never fired on a Friday and fired all day every Sunday until
# 2026-10-27. https://developers.cloudflare.com/workers/configuration/cron-triggers/
# Second entry (added 2026-10-23) dispatches Bullion's news-hourly.yml in the
# claudekit repo -- GitHub's `schedule:` creates only ~2 of its 9 weekday
# slots, the same collapse this Worker already fixed for graywind. Must match
# BULLION_CRON in src/index.js exactly; that's how scheduled() tells them apart.
crons = ["*/15 13-20 * * mon-fri", "11 13-21 * * mon-fri"]

# Non-secret: which repo/workflow to dispatch. GITHUB_PAT is set separately
# via `wrangler secret put GITHUB_PAT` -- never put a real token in this
# file, it's committed to the repo. Same for TRIGGER_SECRET (see src/index.js's
# fetch() handler): `wrangler secret put TRIGGER_SECRET`, run it yourself so
# the value never passes through this session. Until it's set, env.TRIGGER_SECRET
# is undefined and every manual GET 404s -- fails closed, not open.
[vars]
GITHUB_OWNER = "SinbadTheExplorer"
GITHUB_REPO = "graywind"
GITHUB_WORKFLOW_FILE = "live-trading.yml"
BULLION_REPO = "claudekit"
BULLION_WORKFLOW_FILE = "news-hourly.yml"
